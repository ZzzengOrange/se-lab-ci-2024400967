name: Deploy Pipeline

on:
  push:
    branches: [ main ]

# 定义全局环境变量
env:
  IMAGE_NAME: zzzorange967/se-web-app

jobs:
  # ================= 阶段 1：自动化测试 =================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  # ================= 阶段 2：构建并推送 Docker 镜像 =================
  build-and-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🕵️ 诊断步骤：检查 Secrets 是否成功读取（不会泄露密码，只显示是否为空）
      - name: Check Secrets Availability
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "❌ 错误：未找到 DOCKERHUB_USERNAME，请检查 GitHub Secrets 配置！"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "❌ 错误：未找到 DOCKERHUB_TOKEN，请检查 GitHub Secrets 配置！"
            exit 1
          fi
          echo "✅ Secrets 读取正常，准备登录 Docker Hub..."

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.SHORT_SHA }}

  # ================= 阶段 3：本地部署与验证 =================
  deploy-verify:
    name: Deploy & Smoke Test
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Deploy container locally
        run: |
          docker stop se-web-app || true
          docker rm se-web-app || true
          docker run -d --name se-web-app -p 8080:5000 ${{ env.IMAGE_NAME }}:latest

      - name: Wait for app to start
        run: sleep 5

      - name: Smoke Test (Verify deployment)
        run: |
          curl --fail http://localhost:8080 || (echo "❌ Deployment verification failed!" && exit 1)
          echo "✅ Deployment verification successful! App is running."

      - name: Show running containers
        run: docker ps
