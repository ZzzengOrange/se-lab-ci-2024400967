name: Deploy Pipeline

on:
  push:
    branches: [ main ]

# 定义全局环境变量，方便后续引用
env:
  IMAGE_NAME: zzzorange967/se-web-app

jobs:
  # --- 阶段 1：自动化测试 ---
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  # --- 阶段 2：构建并推送 Docker 镜像 ---
  build-and-push:
    name: Build & Push Image
    needs: test  # 必须等测试通过才执行
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 获取 Git 提交的短哈希值（实验文档要求：标签需包含 commit-SHA）
      - name: Get short SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 按照实验要求，同时打上 latest 和 commit-SHA 标签
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.SHORT_SHA }}

  # --- 阶段 3：本地部署与验证 (替代 SSH 远程部署) ---
  deploy-verify:
    name: Deploy & Smoke Test
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Deploy container locally
        run: |
          # 停止并删除可能存在的旧容器
          docker stop se-web-app || true
          docker rm se-web-app || true
          # 启动新容器，映射端口 (假设你的 Flask 应用运行在 5000 端口)
          docker run -d --name se-web-app -p 8080:5000 ${{ env.IMAGE_NAME }}:latest

      - name: Wait for app to start
        run: sleep 5  # 等待容器完全启动

      - name: Smoke Test (Verify deployment)
        run: |
          # 使用 curl 测试应用是否正常响应
          # 如果应用根路径返回 200 OK，则部署验证成功
          curl --fail http://localhost:8080 || (echo "Deployment verification failed!" && exit 1)
          echo "✅ Deployment verification successful! App is running."

      - name: Show running containers
        run: docker ps
