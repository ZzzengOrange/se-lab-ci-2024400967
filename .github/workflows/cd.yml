name: CD Pipeline V2

on:
  push:
    branches: [ main ]

jobs:
  # --- 阶段 1：测试 ---
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  # --- 阶段 2：构建与推送 ---
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: Zzzorange967/se-web-app:latest

  # --- 阶段 3：部署到服务器 (新增部分) ---
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. 登录 Docker Hub (如果镜像是私有的，这一步必须；如果是公开的，可以省略)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 2. 停止并删除旧容器 (防止端口冲突)
            docker stop se-web-app || true
            docker rm se-web-app || true

            # 3. 拉取最新镜像
            docker pull Zzzorange967/se-web-app:latest

            # 4. 启动新容器
            # -d: 后台运行
            # --name: 容器名称
            # -p 80:5000: 将服务器的80端口映射到容器的5000端口 (根据你的 app.py 设置调整)
            docker run -d --name se-web-app -p 80:5000 Zzzorange967/se-web-app:latest

            # 5. 清理不再使用的旧镜像 (可选，节省空间)
            docker image prune -f
